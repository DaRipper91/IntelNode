name: Debug APK (branches)

# Builds a debug APK for work-in-progress branches and uploads it as a workflow
# artifact only. It never creates a tag or a GitHub Release, so it cannot touch
# the `latest-build` prerelease or the "Latest" release that flutter-build.yml
# and release.yml manage. contents: read below enforces that at the token level.

on:
  push:
    branches:
      - 'wip/**'
      - 'rebase/**'
      - 'debug/**'
  workflow_dispatch:

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: floating `stable` now needs Gradle >= 9.3.1, but the project
          # wrapper is on 8.11.1. 3.41.6 is the version the app is built against.
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Accept Android SDK licenses
        run: |
          # `yes` exits on SIGPIPE once sdkmanager is done; without this the
          # pipeline fails under pipefail even on success.
          set +o pipefail
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets (fork or missing); falling back to the throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/intelnode.jks
          {
            echo "storeFile=intelnode.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DaRipped-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
