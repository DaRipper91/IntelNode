name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Accept Android SDK licenses
        run: |
          # `yes` exits on SIGPIPE once sdkmanager is done; without this the
          # pipeline fails under pipefail even on success.
          set +o pipefail
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets (fork or missing); falling back to the throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/intelnode.jks
          {
            echo "storeFile=intelnode.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: |
          # Use settings from CLAUDE.md for optimized ARM64 build
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=./debug_info

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaRipped-APKs
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest DaRipped APK Build
          body: |
            Automated build of the DaRipped Tiny Computer app.
            
            Included builds:
            - **Debug APK**: (Universal) Good for quick testing.
            - **Release APK**: (ARM64-v8a) Optimized for Tensor G5 / Pixel 10 Pro. (May be unsigned if signing secrets are not set).
            
            Build ID: ${{ github.run_id }}
            Commit: ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
