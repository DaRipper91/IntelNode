<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
<title id="t">IntelNode hero</title>
<desc id="d">Animated terminal-style header reading IntelNode, with drifting waves, a scanline and a glitch effect. Tagline: Arch Linux ARM in proot on Android, no root, one APK.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11111b"/><stop offset="1" stop-color="#1e1e2e"/></linearGradient>
<linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cba6f7"/><stop offset=".5" stop-color="#89b4fa"/><stop offset="1" stop-color="#74c7ec"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74c7ec" stop-opacity="0"/><stop offset=".5" stop-color="#74c7ec" stop-opacity=".16"/><stop offset="1" stop-color="#74c7ec" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="320" rx="14"/></clipPath></defs>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}

.t{font-weight:700;font-size:104px;letter-spacing:2px}
.tag{font-size:22px;fill:#cdd6f4}
.sm{font-size:15px;fill:#a6adc8}
.gr{opacity:0}
@media (prefers-reduced-motion: no-preference){
.wa{animation:wv 14s linear infinite} .wb{animation:wv 22s linear infinite reverse} .wc{animation:wv 9s linear infinite}
@keyframes wv{to{transform:translateX(-240px)}}
.sc{animation:sc 5s linear infinite}
@keyframes sc{from{transform:translateY(-90px)}to{transform:translateY(320px)}}
.m{animation:fl 8s steps(1,end) infinite}
@keyframes fl{0%{opacity:0}2%{opacity:1}3%{opacity:.2}4%{opacity:1}6%{opacity:.5}7%,100%{opacity:1}}
.gr{animation:gl 8s steps(1,end) infinite}
.g2{animation-name:gl2}
@keyframes gl{0%{opacity:.9;transform:translate(-9px,2px)}2%{opacity:.9;transform:translate(7px,-3px)}4%{opacity:.9;transform:translate(-4px,0)}6%{opacity:0}60%{opacity:.8;transform:translate(-5px,1px)}61.5%{opacity:0}100%{opacity:0}}
@keyframes gl2{0%{opacity:.9;transform:translate(9px,-2px)}2%{opacity:.9;transform:translate(-7px,3px)}4%{opacity:.9;transform:translate(4px,0)}6%{opacity:0}60%{opacity:.8;transform:translate(5px,-1px)}61.5%{opacity:0}100%{opacity:0}}
.tg{animation:tg 8s ease-out infinite}
@keyframes tg{0%,8%{opacity:0;transform:translateY(8px)}16%,100%{opacity:1;transform:none}}
.cur{animation:bl 1.1s steps(1,end) infinite}
@keyframes bl{50%{opacity:0}}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="320" fill="url(#bg)"/>
<g transform="translate(-240,0)">
<g class="wc"><path d="M0 235 q60.0 -22 120.0 0 t120.0 0 q60.0 -22 120.0 0 t120.0 0 q60.0 -22 120.0 0 t120.0 0 q60.0 -22 120.0 0 t120.0 0 q60.0 -22 120.0 0 t120.0 0 q60.0 -22 120.0 0 t120.0 0 q60.0 -22 120.0 0 t120.0 0 q60.0 -22 120.0 0 t120.0 0 V320 H0 Z" fill="url(#w1)" opacity="0.1"/></g>
<g class="wb"><path d="M0 255 q60.0 -28 120.0 0 t120.0 0 q60.0 -28 120.0 0 t120.0 0 q60.0 -28 120.0 0 t120.0 0 q60.0 -28 120.0 0 t120.0 0 q60.0 -28 120.0 0 t120.0 0 q60.0 -28 120.0 0 t120.0 0 q60.0 -28 120.0 0 t120.0 0 q60.0 -28 120.0 0 t120.0 0 V320 H0 Z" fill="url(#w1)" opacity="0.14"/></g>
<g class="wa"><path d="M0 280 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 V320 H0 Z" fill="url(#w1)" opacity="0.2"/></g>
</g>
<rect class="sc" y="0" width="1200" height="90" fill="url(#scan)"/>
<rect width="1200" height="34" fill="#181825"/>
<circle cx="24" cy="17" r="6" fill="#f38ba8"/><circle cx="44" cy="17" r="6" fill="#f9e2af"/><circle cx="64" cy="17" r="6" fill="#a6e3a1"/>
<text x="600.0" y="22" text-anchor="middle" class="sm">tiny@intelnode: ~</text>
<text x="48" y="84" class="sm"><tspan fill="#a6e3a1">tiny@intelnode</tspan> <tspan fill="#89b4fa">~</tspan> <tspan fill="#cba6f7">$</tspan> <tspan fill="#cdd6f4">start-desktop</tspan><tspan class="cur" fill="#cdd6f4"> _</tspan></text>
<g transform="translate(48,190)">
<text class="t gr" fill="#f38ba8">IntelNode</text>
<text class="t gr g2" fill="#74c7ec">IntelNode</text>
<text class="t m" fill="#cba6f7">IntelNode</text>
</g>
<g class="tg">
<text x="52" y="238" class="tag">Arch Linux ARM in proot on Android. No root. One APK.</text>
</g>
<text x="1176" y="302" text-anchor="end" class="sm">fork of Cateners/tiny_computer  //  GPL-3.0</text>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="14" fill="none" stroke="#45475a"/>
</svg>
