<text x="50" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6c7086">Pixel 10 Pro, Android 17 DP11, bundled-rootfs debug build, 2026-11-15. Timestamps are observed over adb;</text><text x="50" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6c7086">stage names (extract, boot) are inferred from timing. Tar = 829,367,415 bytes = 791 MiB.</text>
