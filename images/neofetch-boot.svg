<text x="300" y="100"><tspan fill="#cba6f7" font-weight="700">tiny</tspan><tspan fill="#cdd6f4">@</tspan><tspan fill="#cba6f7" font-weight="700">intelnode</tspan></text><text x="300" y="124" fill="#a6adc8">--------------</text><text x="300" y="148"><tspan fill="#89b4fa" font-weight="700">OS</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#cdd6f4">Arch Linux ARM aarch64</tspan></text><text x="300" y="172"><tspan fill="#89b4fa" font-weight="700">Host</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#cdd6f4">Android, ARM64, no root</tspan></text><text x="300" y="196"><tspan fill="#89b4fa" font-weight="700">Runtime</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#cdd6f4">proot + busybox</tspan></text><text x="300" y="220"><tspan fill="#89b4fa" font-weight="700">App</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#cdd6f4">Flutter, single APK</tspan></text><text x="300" y="244"><tspan fill="#89b4fa" font-weight="700">Display</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#cdd6f4">in-app X server (x11_flutter)</tspan></text><text x="300" y="268"><tspan fill="#89b4fa" font-weight="700">User</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#cdd6f4">tiny (uid 1000, wheel)</tspan></text><text x="300" y="292"><tspan fill="#89b4fa" font-weight="700">Session</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#cdd6f4">~/.intelnode-session</tspan></text><text x="300" y="316"><tspan fill="#89b4fa" font-weight="700">DE</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#cdd6f4">XFCE4 LXQt MATE</tspan></text><text x="300" y="340"><tspan fill="#89b4fa" font-weight="700">WM</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#cdd6f4">i3 Openbox Fluxbox IceWM</tspan></text><text x="300" y="364"><tspan fill="#89b4fa" font-weight="700">Status</tspan><tspan fill="#a6adc8">: </tspan><tspan fill="#f9e2af">unverified on device</tspan></text>
