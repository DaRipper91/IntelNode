<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
<title id="t">neofetch for the IntelNode Arch container</title>
<desc id="d">A terminal window that types out neofetch-style system facts for the Arch Linux ARM container in IntelNode and ends on a blinking cursor. Status line says unverified on device.</desc>
