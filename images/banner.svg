<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">IntelNode</title>
  <desc id="banner-desc">IntelNode banner: a teal crosshair ring emblem beside the name and the tagline Arch Linux ARM, Android, no root.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#0b1d1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#03d5c1" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#03d5c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2fffd"/>
      <stop offset="1" stop-color="#7ff3e8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#03d5c1" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#03d5c1" stroke-opacity="0.4" stroke-width="2"/>

  <g transform="translate(168 160)" fill="none" stroke="#03d5c1">
    <circle r="84" stroke-width="8"/>
    <circle r="26" fill="#03d5c1" stroke="none"/>
    <g stroke-width="3">
      <line y1="-86" y2="-130"/>
      <line y1="-86" y2="-130" transform="rotate(90)"/>
      <line y1="-86" y2="-130" transform="rotate(180)"/>
      <line y1="-86" y2="-130" transform="rotate(270)"/>
    </g>
    <g stroke-width="3" stroke-opacity="0.75">
      <line y1="-92" y2="-114" transform="rotate(45)"/>
      <line y1="-92" y2="-114" transform="rotate(135)"/>
      <line y1="-92" y2="-114" transform="rotate(225)"/>
      <line y1="-92" y2="-114" transform="rotate(315)"/>
    </g>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <text x="340" y="150" font-size="88" font-weight="800" fill="url(#title)">IntelNode</text>
    <text x="344" y="196" font-size="20" font-weight="600" letter-spacing="5" fill="#03d5c1">ARCH LINUX ARM  ·  ANDROID  ·  NO ROOT</text>
    <text x="344" y="254" font-size="22" fill="#7a9a96">
      <tspan fill="#03d5c1">$</tspan> pacman -Syu --noconfirm
      <tspan fill="#03d5c1">
        _
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1.2s" repeatCount="indefinite"/>
      </tspan>
    </text>
  </g>
</svg>
