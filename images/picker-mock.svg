<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="t d">
<title id="t">Desktop picker mock</title>
<desc id="d">Illustrative mock of the stage 2 picker: Desktop Environments (XFCE4, LXQt, MATE) and Window Managers (i3, Openbox, Fluxbox, IceWM), with niri and COSMIC shown disabled as previews. A highlight cycles through the options.</desc>
<defs></defs>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}

text{font-size:14px}
@media (prefers-reduced-motion: no-preference){
.dot,.sel{animation:sl 14s steps(1,end) infinite}
.d0{animation-delay:0s}
.d1{animation-delay:2s}
.d2{animation-delay:4s}
.d3{animation-delay:6s}
.d4{animation-delay:8s}
.d5{animation-delay:10s}
.d6{animation-delay:12s}
@keyframes sl{0%{opacity:1}14.28%,100%{opacity:0}}
.cur{animation:bl 1s steps(1,end) infinite}
@keyframes bl{50%{opacity:0}}
}
.dot,.sel{opacity:0}
.d0{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
