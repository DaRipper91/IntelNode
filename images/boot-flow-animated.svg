<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
<title id="t">IntelNode first-run boot flow</title>
<desc id="d">Animated flow of the two-stage first run: download the Arch Linux ARM base, verify the md5, extract, provision, boot check, then pick a desktop or window manager, write the session file and launch start-desktop.</desc>
<defs><marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#89b4fa"/></marker><marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cba6f7"/></marker></defs>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}

text{font-size:14px}
@media (prefers-reduced-motion: no-preference){
.dash{animation:dm 1s linear infinite}
@keyframes dm{to{stroke-dashoffset:-13}}
.nb{animation:pu 7.2s ease-in-out infinite}
@keyframes pu{0%{stroke-width:2;fill:#313244}6%,12%{stroke-width:4.5;fill:#45475a}22%,100%{stroke-width:2;fill:#313244}}
.ld{animation:ld 1.4s ease-in-out infinite}
@keyframes ld{50%{opacity:.35}}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="1000" height="400" rx="12" fill="#1e1e2e"/>
<text x="40" y="44" fill="#cdd6f4" font-size="18" font-weight="700">first run: two stages</text>
<circle class="ld" cx="270" cy="39" r="4" fill="#f9e2af"/>
<text x="282" y="44" fill="#f9e2af" font-size="13">new flow, not yet run on a device</text>
<g font-size="12"><rect x="40" y="62" width="10" height="10" fill="#89b4fa"/><text x="58" y="72" fill="#a6adc8">Stage 1: base install (steps 01-05)</text>
<rect x="400" y="62" width="10" height="10" fill="#cba6f7"/><text x="418" y="72" fill="#a6adc8">Stage 2: pick and launch (steps 06-08)</text></g>
<path class="dash" d="M240 152.0 H290" fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arb)"/><path class="dash" d="M490 152.0 H540" fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arb)"/><path class="dash" d="M740 152.0 H790" fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arb)"/><path class="dash" d="M890.0 194 V270" fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arb)"/><path class="dash" d="M790 312.0 H740" fill="none" stroke="#cba6f7" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arm)"/><path class="dash" d="M540 312.0 H490" fill="none" stroke="#cba6f7" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arm)"/><path class="dash" d="M290 312.0 H240" fill="none" stroke="#cba6f7" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arm)"/>
<g><rect class="nb n0" x="40" y="110" width="200" height="84" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2" style="animation-delay:0.0s"/><text x="54" y="132" fill="#a6adc8" font-size="11">01</text><text x="54" y="156" fill="#89b4fa" font-size="17" font-weight="700">Download base</text><text x="54" y="176" fill="#cdd6f4" font-size="12.5">HTTPS mirror, ~700 MB</text></g><g><rect class="nb n1" x="290" y="110" width="200" height="84" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2" style="animation-delay:0.9s"/><text x="304" y="132" fill="#a6adc8" font-size="11">02</text><text x="304" y="156" fill="#89b4fa" font-size="17" font-weight="700">Verify</text><text x="304" y="176" fill="#cdd6f4" font-size="12.5">published .md5</text></g><g><rect class="nb n2" x="540" y="110" width="200" height="84" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2" style="animation-delay:1.8s"/><text x="554" y="132" fill="#a6adc8" font-size="11">03</text><text x="554" y="156" fill="#89b4fa" font-size="17" font-weight="700">Extract</text><text x="554" y="176" fill="#cdd6f4" font-size="12.5">proot + busybox/tar</text></g><g><rect class="nb n3" x="790" y="110" width="200" height="84" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2" style="animation-delay:2.7s"/><text x="804" y="132" fill="#a6adc8" font-size="11">04</text><text x="804" y="156" fill="#89b4fa" font-size="17" font-weight="700">Provision</text><text x="804" y="176" fill="#cdd6f4" font-size="12.5">keyring, user, locale</text></g><g><rect class="nb n4" x="790" y="270" width="200" height="84" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2" style="animation-delay:3.6s"/><text x="804" y="292" fill="#a6adc8" font-size="11">05</text><text x="804" y="316" fill="#89b4fa" font-size="17" font-weight="700">Boot check</text><text x="804" y="336" fill="#cdd6f4" font-size="12.5">verify it boots</text></g><g><rect class="nb n5" x="540" y="270" width="200" height="84" rx="10" fill="#313244" stroke="#cba6f7" stroke-width="2" style="animation-delay:4.5s"/><text x="554" y="292" fill="#a6adc8" font-size="11">06</text><text x="554" y="316" fill="#cba6f7" font-size="17" font-weight="700">Picker</text><text x="554" y="336" fill="#cdd6f4" font-size="12.5">DE or WM</text></g><g><rect class="nb n6" x="290" y="270" width="200" height="84" rx="10" fill="#313244" stroke="#cba6f7" stroke-width="2" style="animation-delay:5.4s"/><text x="304" y="292" fill="#a6adc8" font-size="11">07</text><text x="304" y="316" fill="#cba6f7" font-size="17" font-weight="700">Write session</text><text x="304" y="336" fill="#cdd6f4" font-size="12.5">~/.intelnode-session</text></g><g><rect class="nb n7" x="40" y="270" width="200" height="84" rx="10" fill="#313244" stroke="#cba6f7" stroke-width="2" style="animation-delay:6.3s"/><text x="54" y="292" fill="#a6adc8" font-size="11">08</text><text x="54" y="316" fill="#cba6f7" font-size="17" font-weight="700">start-desktop</text><text x="54" y="336" fill="#cdd6f4" font-size="12.5">launches session</text></g>
<text x="40" y="374" fill="#a6adc8" font-size="12.5">Both stages run in an interactive terminal on the loading screen (Copy selection, Copy all, Paste).</text>
<rect x=".5" y=".5" width="999" height="399" rx="12" fill="none" stroke="#45475a"/>
</svg>
