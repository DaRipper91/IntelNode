<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 288" width="900" height="288" role="img" aria-labelledby="t d">
  <title id="t">The 60-second X server probe</title>
  <desc id="d">Sixty ticks fill one per second while the app probes 127.0.0.1 port 7897, then turn red and show the timeout message.</desc>
  <defs></defs>
  <rect width="900" height="288" rx="14" fill="#1e1e2e"/>
<text x="50" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#cdd6f4" font-weight="700">waitForXServer: 60 one-second probes</text>
<text x="50" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#a6adc8">each tick = isXServerReady(127.0.0.1, 7897) returning false, then a 1 s sleep</text>
