<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">A real boot.log excerpt from a successful boot</title>
<desc id="d">Eight real IntelNode log lines from the Pixel 10 Pro: X server thread started, X server ready after 0s, startxfce4 launched, then two warnings from the XFCE session.</desc>
<rect width="900" height="330" rx="14" fill="#1e1e2e"/>
<rect x="20" y="20" width="860" height="260" rx="10" fill="#11111b" stroke="#45475a"/>
<rect x="20" y="20" width="860" height="30" rx="10" fill="#313244"/><rect x="20" y="40" width="860" height="10" fill="#313244"/>
<circle cx="42" cy="35" r="5" fill="#f38ba8"/><circle cx="60" cy="35" r="5" fill="#f9e2af"/><circle cx="78" cy="35" r="5" fill="#a6e3a1"/>
<text x="450" y="39" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#a6adc8">files/boot.log (excerpt)</text>
<text x="36" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cdd6f4">IntelNode +0.1s X server thread started<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.09;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cdd6f4">IntelNode +0.3s waiting for X server on 127.0.0.1:7897 (timeout 60s)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.18;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#a6e3a1">IntelNode +0.4s X server ready after 0s<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.23;0.27;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#a6adc8">IntelNode +1.0s [term] [Log] Socket synchronization successful: /tmp/.X11-unix/X4 is ready.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.36;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#a6adc8">IntelNode +1.0s [term] [Log] Launching startxfce4 Session via DBUS Wrapper...<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.45;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#a6adc8">IntelNode +1.0s [term] /usr/sbin/startxfce4: X server already running on display :4<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.54;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#f9e2af">IntelNode +4.3s [term] (xfce4-session:28714): libxfce4util-WARNING **: 13:57:27.579: Failed to get a systemd proxy: …<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.59;0.63;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="36" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#f9e2af">IntelNode +25.7s [term] (xfce4-panel:29490): Gtk-WARNING **: 13:57:49.062: Could not load a pixbuf from icon theme.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.72;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="450" y="308" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6c7086">Real excerpt (grep-filtered) from a successful run on a Pixel 10 Pro. The xfce4-session line is shortened with an ellipsis.</text>
</svg>
