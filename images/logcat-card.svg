<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 308" width="900" height="308" role="img" aria-labelledby="t d">
  <title id="t">What a failed boot looks like in logcat</title>
  <desc id="d">A terminal card replaying the IntelNode log lines: workflow started, container launch, X server launch and wait, then the timeout.</desc>
  <defs></defs>
  <rect width="900" height="308" rx="14" fill="#1e1e2e"/>
<rect x="20" y="20" width="860" height="250" rx="10" fill="#11111b" stroke="#45475a"/>
<rect x="20" y="20" width="860" height="30" rx="10" fill="#313244"/><rect x="20" y="40" width="860" height="10" fill="#313244"/>
<circle cx="42" cy="35" r="5" fill="#f38ba8"/><circle cx="60" cy="35" r="5" fill="#f9e2af"/><circle cx="78" cy="35" r="5" fill="#a6e3a1"/>
<text x="450" y="39" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#a6adc8">adb logcat -d | grep IntelNode</text>
<text x="40" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd6f4">IntelNode +0.4s workflow started<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.09;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd6f4">IntelNode +1.0s launching container 0<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.19;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#a6adc8">IntelNode +1.3s [term] &lt;boot command output, one line each&gt;<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.29;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="163" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd6f4">IntelNode +9.7s launching X server (xkb root: .../usr/share/xkeyboard-config-2)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.39;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd6f4">IntelNode +9.9s waiting for X server on 127.0.0.1:7897 (timeout 60s)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.49;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#f38ba8">IntelNode +70.0s X server not ready after 60s (launch failed: &lt;reason, if any&gt;)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.59;0.93;1" dur="12s" repeatCount="indefinite"/></text>
<rect x="40" y="232" width="9" height="15" fill="#a6e3a1"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<text x="450" y="292" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6c7086">Illustrative: the line formats are the real ones from lib/boot_log.dart; this output was NOT captured from a device yet.</text>
</svg>
